
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-inference-engine"
version = "0.1.0"
description = "A Python framework for stochastic simulation, calibration, and statistical model evaluation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ratul Chakraborty" }
]
license = "MIT"

keywords = [
    "stochastic-processes",
    "stochastic-calculus",
    "sde",
    "monte-carlo",
    "mcmc",
    "jump-diffusion",
    "parameter-estimation",
    "statistical-inference",
    "quantitative-finance"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0"
]
examples = [
    "matplotlib>=3.6",
    "pandas>=1.5"
]

[project.urls]
Homepage = "https://github.com/RatChakraborty/StochasticInferenceEngine"
Repository = "https://github.com/RatChakraborty/StochasticInferenceEngine"

[tool.setuptools.packages.find]
where = ["."]
include = ["stochastic_inference_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

