[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic_inference_engine"
version = "0.1.0"
description = "A Python library for stochastic calculus, MCMC sampling, and FFT density recovery"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ratul Chakraborty", email = "ratulc@andrew.cmu.edu" }
]
license = { text = "MIT" }
keywords = ["stochastic-calculus", "mcmc", "monte-carlo", "fft", "sde"]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0"
]

[project.urls]
Homepage = "https://github.com/RatChakraborty/StochasticInferenceEngine"

[tool.setuptools.packages.find]
where = ["."]
